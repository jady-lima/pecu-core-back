# Configuração usada só pelos testes: não precisa de PostgreSQL nem do arquivo .env.
# Este arquivo substitui o application.properties de src/main durante os testes.
spring.application.name=system

spring.datasource.url=jdbc:h2:mem:agrocore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

api.security.token.secret=segredo-de-teste-com-pelo-menos-32-caracteres
app.cors.allowed-origins=http://localhost:5173

admin.nome=Administrador de Teste
admin.username=admin@teste.com
admin.senha=senha-de-teste

pesagem.intervalo-recomendado-dias=15

ia.gemini.api-key=
ia.gemini.modelo=gemini-2.5-flash
ia.gemini.url=http://localhost:9/sem-ia-nos-testes
ia.gemini.timeout=1s

agrocore.aplicacao=bovinos